server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # CORS configuration
    add_header 'Access-Control-Allow-Origin' 'http://amdmini01.isleta.abqwebdev.com:8080' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Authorization' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
    
    # Handle OPTIONS request
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' 'http://amdmini01.isleta.abqwebdev.com:8080' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Authorization' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Content-Type' 'text/plain charset=UTF-8';
        add_header 'Content-Length' '0';
        return 204;
    }

    # Handle Flutter routing for client-side navigation
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache control for static assets
    location ~* \.(ico|css|js|gif|jpeg|jpg|png|woff|ttf|otf|svg|woff2|eot|wasm)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header 'Access-Control-Allow-Origin' 'http://amdmini01.isleta.abqwebdev.com:8080' always;
        access_log off;
    }

    # Disable caching for service worker to ensure updates are reflected
    location = /flutter_service_worker.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header 'Access-Control-Allow-Origin' 'http://amdmini01.isleta.abqwebdev.com:8080' always;
    }
}